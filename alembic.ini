# Конфигурация Alembic.
#
# URL базы здесь намеренно отсутствует: он приходит из окружения через
# brain.config (инвариант 6 — никаких секретов в файлах репозитория).
# Подстановкой занимается env.py.

[alembic]
script_location = src/brain/storage/migrations
prepend_sys_path = src
path_separator = os

# Имя файла миграции начинается с даты — так история читается по `ls`.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Ревизии пишутся в UTC, чтобы порядок не зависел от машины.
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
