name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # Быстрая проверка: без базы, без сети. Должна отрабатывать за секунды.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Установить uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Синхронизировать зависимости
        run: uv sync --frozen

      - name: Форматирование
        run: uv run ruff format --check .

      - name: Линт
        run: uv run ruff check .

      - name: Типы
        run: uv run mypy

      - name: Быстрые тесты
        run: uv run pytest

  # Живой Postgres: миграции на пустой базе и тесты, которым нужна база.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_USER: brain
          POSTGRES_PASSWORD: brain
          POSTGRES_DB: brain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brain -d brain"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://brain:brain@localhost:5432/brain
    steps:
      - uses: actions/checkout@v5

      - name: Установить uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Синхронизировать зависимости
        run: uv sync --frozen

      - name: Миграции на пустой базе
        run: uv run alembic upgrade head

      - name: Тесты с базой
        run: uv run pytest -m integration
